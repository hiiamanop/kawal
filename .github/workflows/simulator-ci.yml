name: Ticket Simulator CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "contracts/**"
      - "services/simulator/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".dockerignore"
      - ".github/workflows/simulator-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "contracts/**"
      - "services/simulator/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".dockerignore"
      - ".github/workflows/simulator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  dockerhub:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@b5ca514310cf82a5a71af869fa721167a8a1aa14
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf63236fb46c531dc8080283b84
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kawal-ticket-simulator
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: .
          file: services/simulator/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
